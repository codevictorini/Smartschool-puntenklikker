<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Stuur een bericht naar de PuntKlik-owner.">
  <title>Contact - PuntKlik</title>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <header class="wrap site-header">
    <a class="brand" href="index.html" aria-label="PuntKlik">
      <img src="assets/logo.svg" alt="">
      <strong data-site-content="brand.name" data-site-label="Naam in de navigatie">PuntKlik</strong>
    </a>
    <nav class="site-toolbar" aria-label="Website">
      <a class="page-link" href="index.html" data-site-link="link.nav.home" data-site-label="Link navigatie: Home"><span data-site-content="nav.home" data-site-label="Navigatietekst: Home">Home</span></a>
      <a class="page-link" href="download.html" data-site-link="link.nav.download" data-site-label="Link navigatie: Download"><span data-site-content="nav.download" data-site-label="Navigatietekst: Download">Download</span></a>
      <a class="page-link" href="roadmap.html" data-site-link="link.nav.roadmap" data-site-label="Link navigatie: Roadmap"><span data-site-content="nav.roadmap" data-site-label="Navigatietekst: Roadmap">Roadmap</span></a>
      <a class="page-link" href="about.html" data-site-link="link.nav.about" data-site-label="Link navigatie: About us"><span data-site-content="nav.about" data-site-label="Navigatietekst: About us">About us</span></a>
      <a class="page-link" href="privacy.html" data-site-link="link.nav.privacy" data-site-label="Link navigatie: Privacy"><span data-site-content="nav.privacy" data-site-label="Navigatietekst: Privacy">Privacy</span></a>
      <a class="page-link" href="contact.html" data-site-link="link.nav.contact" data-site-label="Link navigatie: Contact" aria-current="page"><span data-site-content="nav.contact" data-site-label="Navigatietekst: Contact">Contact</span></a>
      <a class="page-link" href="owner.html" data-site-link="link.nav.owner" data-site-label="Link navigatie: Ownerpanel"><span data-site-content="nav.owner" data-site-label="Navigatietekst: Ownerpanel">Ownerpanel</span></a>
      <a class="github-link" href="https://github.com/codevictorini/Smartschool-puntenklikker" data-site-link="link.github" data-site-label="GitHub-link" target="_blank" rel="noopener noreferrer">
        <img class="github-icon" src="assets/github.svg" alt="">
        <span data-site-content="nav.github" data-site-label="GitHub-knoptekst">GitHub</span>
      </a>
      <a class="discord-link" href="https://discord.gg/tkq7xkgW3z" data-site-link="link.discord" data-site-label="Discord-link" target="_blank" rel="noopener noreferrer" aria-label="Open de PuntKlik Discord-server">
        <img class="discord-icon" src="assets/discord.svg" alt="">
      </a>
    </nav>
  </header>

  <main class="wrap">
    <h1 data-site-content="contact.title" data-site-label="Contact: titel">Contact</h1>
    <p class="form-panel" data-site-content="contact.intro" data-site-label="Contact: introductie">Vraag of feedback? Stuur een bericht naar de owner.</p>
    <form class="contact-form form-panel" id="contact-form">
      <label for="contact-name"><span data-site-content="contact.name-label" data-site-label="Contactformulier: naamlabel">Je naam</span>
        <input id="contact-name" name="name" type="text" minlength="2" maxlength="80" autocomplete="name" required>
      </label>
      <label for="contact-message"><span data-site-content="contact.message-label" data-site-label="Contactformulier: berichtlabel">Bericht</span>
        <textarea id="contact-message" name="message" minlength="5" maxlength="1500" required></textarea>
      </label>
      <label class="contact-honeypot" aria-hidden="true" for="contact-company">Laat dit veld leeg
        <input id="contact-company" name="company" type="text" tabindex="-1" autocomplete="off">
      </label>
      <button type="submit" data-site-content="contact.submit">Verstuur bericht</button>
      <p class="contact-status" id="contact-status" role="status" aria-live="polite"></p>
    </form>
    <p><a href="privacy.html" data-site-link="link.nav.privacy" data-site-label="Contact: privacylink" data-site-content="contact.privacy-link">Lees het privacybeleid</a><span data-site-content="contact.privacy-suffix" data-site-label="Contact: privacyuitleg"> voor meer informatie over je gegevens.</span></p>
  </main>

  <footer class="wrap site-footer">
    <a href="index.html" data-site-link="link.nav.home" data-site-label="Footer: Home-link" data-site-content="footer.back-home">Terug naar PuntKlik</a>
  </footer>
  <script src="supabase-config.js"></script>
  <script src="site-auth.js"></script>
  <script src="site-content.js"></script>
  <script src="contact.js"></script>
</body>
</html>
