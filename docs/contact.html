<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Stuur een bericht naar de PuntKlik-owner.">
  <title>Contact - PuntKlik</title>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <header class="wrap site-header">
    <a class="brand" href="index.html" aria-label="PuntKlik">
      <img src="assets/logo.svg" alt="">
      <strong>PuntKlik</strong>
    </a>
    <nav class="site-toolbar" aria-label="Website">
      <a class="page-link" href="index.html">Home</a>
      <a class="page-link" href="download.html">Download</a>
      <a class="page-link" href="roadmap.html">Roadmap</a>
      <a class="page-link" href="about.html">About us</a>
      <a class="page-link" href="privacy.html">Privacy</a>
      <a class="page-link" href="contact.html" aria-current="page">Contact</a>
      <a class="github-link" href="https://github.com/codevictorini/Smartschool-puntenklikker" target="_blank" rel="noopener noreferrer">
        <img class="github-icon" src="assets/github.svg" alt="">
        <span>GitHub</span>
      </a>
      <a class="discord-link" href="https://discord.gg/R5K48S3Ufj" target="_blank" rel="noopener noreferrer" aria-label="Open de PuntKlik Discord-server">
        <img class="discord-icon" src="assets/discord.svg" alt="">
      </a>
    </nav>
  </header>

  <main class="wrap">
    <h1>Contact</h1>
    <p class="form-panel">Vraag of feedback? Stuur een bericht naar de owner.</p>
    <form class="contact-form form-panel" id="contact-form">
      <label for="contact-name">Je naam
        <input id="contact-name" name="name" type="text" minlength="2" maxlength="80" autocomplete="name" required>
      </label>
      <label for="contact-message">Bericht
        <textarea id="contact-message" name="message" minlength="5" maxlength="1500" required></textarea>
      </label>
      <label class="contact-honeypot" aria-hidden="true" for="contact-company">Laat dit veld leeg
        <input id="contact-company" name="company" type="text" tabindex="-1" autocomplete="off">
      </label>
      <button type="submit">Verstuur bericht</button>
      <p class="contact-status" id="contact-status" role="status" aria-live="polite"></p>
    </form>
    <p><a href="privacy.html">Lees het privacybeleid</a> voor meer informatie over je gegevens.</p>
  </main>

  <footer class="wrap site-footer">
    <a href="index.html">Terug naar PuntKlik</a>
  </footer>
  <script src="supabase-config.js"></script>
  <script src="contact.js"></script>
</body>
</html>
