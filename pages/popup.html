<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PuntKlik</title>
  <style>
    * { box-sizing: border-box; }
    body {
      --paper: #fff7e9;
      --ink: #382b21;
      --accent: #a5553c;
      width: 340px;
      max-height: 580px;
      overflow-y: auto;
      margin: 0;
      padding: 17px;
      background: var(--paper);
      color: var(--ink);
      font: 13px/1.4 "Trebuchet MS", system-ui, sans-serif;
    }
    body[data-decoration="berry"] { --paper: #fff0f2; --ink: #542c3c; --accent: #c04f78; }
    body[data-decoration="mint"] { --paper: #effaf2; --ink: #24463a; --accent: #3f8668; }
    body[data-decoration="night"] { --paper: #292c3b; --ink: #f4e8d2; --accent: #f0b55c; }
    body[data-decoration="watermelon"] { --paper: #f2fae9; --ink: #264b37; --accent: #d65359; }
    body[data-decoration="orange"] { --paper: #fff5e8; --ink: #583823; --accent: #d87129; }
    body[data-decoration="donut"] { --paper: #fff0f5; --ink: #572e47; --accent: #be5681; }
    body[data-decoration="cupcake"] { --paper: #f5f0ff; --ink: #3d3458; --accent: #8162b4; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    header img { width: 43px; height: 43px; transform: rotate(-7deg); }
    h1 { margin: 0; font-size: 20px; line-height: 1.1; }
    h2 { margin: 16px 0 3px; font-size: 15px; }
    .tagline, .hint { margin: 3px 0 0; color: var(--accent); font-size: 12px; }
    .wallet, .state {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 12px;
      border: 1px solid var(--accent);
      border-radius: 11px 9px 12px 8px;
      background: rgb(255 255 255 / 55%);
    }
    .wallet { margin-bottom: 9px; }
    .wallet strong { color: var(--accent); font-size: 16px; }
    .state { margin-bottom: 9px; }
    .state-label { font-weight: 700; }
    .switch { position: relative; width: 44px; height: 26px; flex: none; }
    .switch input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .slider {
      position: absolute;
      inset: 0;
      border: 1px solid var(--accent);
      border-radius: 18px;
      background: transparent;
      cursor: pointer;
    }
    .slider::before {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      content: "";
      transition: transform .16s ease;
    }
    input:checked + .slider::before { transform: translateX(18px); }
    input:focus-visible + .slider { outline: 2px dashed var(--accent); outline-offset: 3px; }
    .status { min-height: 32px; margin: 8px 2px 10px; color: var(--accent); font-size: 12px; }
    .reset, .shop-item button {
      padding: 8px 10px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      font: 700 12px "Trebuchet MS", sans-serif;
      cursor: pointer;
    }
    .reset { width: 100%; }
    .reset:hover, .shop-item button:hover:not(:disabled) { background: rgb(255 255 255 / 55%); }
    .reset:focus-visible, .shop-item button:focus-visible { outline: 2px dashed var(--accent); outline-offset: 2px; }
    .reset.confirm { background: var(--accent); color: var(--paper); }
    .reset:disabled, .shop-item button:disabled { cursor: default; opacity: .6; }
    .message { min-height: 18px; margin: 7px 2px 0; color: var(--accent); font-size: 12px; }
    .shop-list { display: grid; gap: 7px; margin-top: 8px; }
    .shop-item {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border: 1px solid rgb(128 103 76 / 36%);
      border-radius: 9px;
      background: rgb(255 255 255 / 42%);
    }
    .item-name { display: block; font-weight: 700; }
    .item-note { display: block; color: var(--accent); font-size: 11px; }
    .shop-item button { flex: none; }
    .shop-item button.equipped { background: var(--accent); color: var(--paper); }
    .item-swatch {
      display: block;
      width: 40px;
      height: 40px;
    }
    .item-swatch svg { display: block; width: 100%; height: 100%; }
    body[data-decoration="night"] .shop-item { background: rgb(255 255 255 / 8%); }
  </style>
</head>
<body>
  <header>
    <img src="logo.svg" alt="">
    <div>
      <h1>PuntKlik</h1>
      <p class="tagline">Tik je cijfer tevoorschijn.</p>
    </div>
  </header>
  <div class="wallet"><span>Mijn coins</span><strong><span id="coins">0</span> ◉</strong></div>
  <section class="state" aria-label="Instelling PuntKlik">
    <span class="state-label" id="label">PuntKlik staat aan</span>
    <label class="switch" title="PuntKlik aan- of uitzetten">
      <input type="checkbox" id="sw" aria-label="PuntKlik aan of uit">
      <span class="slider"></span>
    </label>
  </section>
  <p class="status" id="st" role="status" aria-live="polite"></p>
  <button class="reset" id="reset" type="button">Punten opnieuw verstoppen</button>
  <p class="message" id="msg" role="status" aria-live="polite"></p>
  <section aria-labelledby="shop-title">
    <h2 id="shop-title">Figurenwinkel</h2>
    <p class="hint">Koop een nieuwe figuur met je coins. Die wordt het ding waarop je tikt.</p>
    <p class="hint">Common 1 · Uncommon 3 · Rare 5 · Epic 8 · Legendary 12 · Mythic 20 coins</p>
    <div class="shop-list" id="shop"></div>
  </section>
  <script src="skins.js"></script>
  <script src="popup.js"></script>
</body>
</html>
