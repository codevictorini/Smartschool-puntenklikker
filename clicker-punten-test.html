<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>PuntKlik interaction test</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Testpunt</h1>
  <p>Toets: 20 november 2026</p>
  <p>Score: <strong id="test-grade">7/10</strong></p>
  <script>
    const saved = {
      enabled: true,
      coins: 0,
      decoration: 'berry',
      rewardedPoints: {},
      revealedV2: {},
    };
    window.chrome = {
      runtime: { lastError: null, getURL: (path) => path },
      storage: {
        local: {
          get: (keys, callback) => callback({ ...saved }),
          set: (updates, callback) => {
            Object.assign(saved, updates);
            if (callback) callback();
          },
        },
        onChanged: { addListener: () => {} },
      },
    };
  </script>
  <script src="skins.js"></script>
  <script src="content.js"></script>
</body>
</html>
